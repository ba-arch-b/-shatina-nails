<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Shatina Press-on Nails｜莎緹娜穿戴甲</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Microsoft JhengHei",Arial,sans-serif;
  background:#fffaf8;
  color:#2b2b2b;
  line-height:1.7;
}

a{
  text-decoration:none;
  color:inherit;
}

img{
  max-width:100%;
  display:block;
}

/* Top Bar */
.header{
  position:sticky;
  top:0;
  z-index:999;
  background:rgba(255,255,255,0.94);
  backdrop-filter:blur(12px);
  border-bottom:1px solid #f2dfe1;
}

.nav{
  max-width:1200px;
  margin:auto;
  padding:12px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
}

.brand img{
  width:54px;
  height:54px;
  object-fit:contain;
}

.brand-text strong{
  display:block;
  font-size:19px;
  letter-spacing:.5px;
}

.brand-text span{
  font-size:13px;
  color:#888;
}

.menu{
  display:flex;
  gap:22px;
  font-size:15px;
  color:#444;
}

.menu a:hover{
  color:#d48795;
}

/* Hero Banner */
.hero{
  background:
    linear-gradient(rgba(255,248,248,.82),rgba(255,232,238,.88)),
    url("hero.jpg");
  background-size:cover;
  background-position:center;
  min-height:620px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:80px 20px;
}

.hero-box{
  max-width:820px;
  background:rgba(255,255,255,.72);
  border:1px solid rgba(255,255,255,.8);
  border-radius:34px;
  padding:52px 34px;
  box-shadow:0 20px 60px rgba(202,130,145,.18);
}

.hero-logo{
  width:230px;
  margin:0 auto 18px;
}

.hero h1{
  font-size:54px;
  line-height:1.12;
  margin:12px 0;
  color:#2b2b2b;
}

.hero h1 span{
  color:#d48795;
}

.hero p{
  font-size:19px;
  color:#666;
  margin:18px auto 0;
  max-width:680px;
}

.buttons{
  margin-top:32px;
  display:flex;
  justify-content:center;
  gap:14px;
  flex-wrap:wrap;
}

.btn{
  padding:13px 26px;
  border-radius:999px;
  font-weight:700;
  color:white;
  box-shadow:0 8px 22px rgba(0,0,0,.08);
}

.btn-pink{
  background:#d48795;
}

.btn-line{
  background:#06C755;
}

.btn-shopee{
  background:#ee4d2d;
}

.btn-dark{
  background:#222;
}

/* General Section */
section{
  max-width:1200px;
  margin:auto;
  padding:76px 20px;
}

.section-title{
  text-align:center;
  margin-bottom:38px;
}

.section-title small{
  color:#d48795;
  font-weight:700;
  letter-spacing:2px;
}

.section-title h2{
  font-size:38px;
  margin:8px 0 10px;
}

.section-title p{
  color:#777;
  max-width:680px;
  margin:auto;
}

/* About */
.about{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:34px;
  align-items:center;
}

.about-card{
  background:white;
  border-radius:28px;
  padding:34px;
  box-shadow:0 10px 30px rgba(0,0,0,.06);
}

.about-card h3{
  font-size:30px;
  margin-top:0;
}

.about-card p{
  color:#666;
}

.about-list{
  margin-top:22px;
  padding:0;
  list-style:none;
}

.about-list li{
  margin:12px 0;
  padding-left:28px;
  position:relative;
}

.about-list li:before{
  content:"✓";
  position:absolute;
  left:0;
  color:#d48795;
  font-weight:bold;
}

/* Services */
.service-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:18px;
}

.service-box{
  background:white;
  border-radius:24px;
  padding:26px;
  box-shadow:0 8px 24px rgba(0,0,0,.06);
}

.service-box h3{
  color:#c87586;
  margin-top:0;
}

.service-box ul{
  padding-left:20px;
  color:#666;
}

/* Product Cards */
.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:24px;
}

.card{
  background:white;
  border-radius:26px;
  overflow:hidden;
  box-shadow:0 10px 30px rgba(0,0,0,.08);
}

.card img{
  width:100%;
  height:330px;
  object-fit:cover;
}

.card-body{
  padding:20px;
}

.tag{
  display:inline-block;
  background:#ffe4ea;
  color:#c87586;
  padding:5px 12px;
  border-radius:999px;
  font-size:13px;
  font-weight:700;
  margin-bottom:10px;
}

.card h3{
  margin:0 0 6px;
  font-size:21px;
}

.card p{
  margin:0;
  color:#666;
  font-size:15px;
}

/* Process */
.process{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:16px;
}

.step{
  background:white;
  border-radius:24px;
  padding:24px;
  text-align:center;
  box-shadow:0 8px 24px rgba(0,0,0,.06);
}

.step-num{
  width:42px;
  height:42px;
  background:#d48795;
  color:white;
  border-radius:50%;
  margin:0 auto 14px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
}

/* Review */
.review-wrap{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:28px;
  align-items:center;
  background:white;
  border-radius:30px;
  padding:26px;
  box-shadow:0 10px 30px rgba(0,0,0,.08);
}

.review-wrap img{
  border-radius:22px;
}

.review-text h3{
  font-size:30px;
  margin-top:0;
}

.review-text p{
  color:#666;
}

/* FAQ */
.faq{
  max-width:850px;
  margin:auto;
}

.faq-item{
  background:white;
  border-radius:22px;
  padding:22px 26px;
  margin-bottom:14px;
  box-shadow:0 6px 20px rgba(0,0,0,.05);
}

.faq-item h3{
  margin:0 0 8px;
  color:#c87586;
}

.faq-item p{
  margin:0;
  color:#666;
}

/* CTA */
.cta{
  background:linear-gradient(135deg,#ffe1e8,#fff7f8);
  border-radius:34px;
  padding:48px 24px;
  text-align:center;
}

.cta h2{
  font-size:34px;
  margin:0 0 10px;
}

.cta p{
  color:#666;
  margin-bottom:24px;
}

/* Footer */
footer{
  background:white;
  border-top:1px solid #f2dfe1;
  text-align:center;
  padding:34px 20px;
  color:#888;
}

/* Floating Buttons */
.float-buttons{
  position:fixed;
  right:18px;
  bottom:22px;
  z-index:999;
  display:flex;
  flex-direction:column;
  gap:12px;
}

.float-buttons a{
  width:58px;
  height:58px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
  font-size:24px;
  box-shadow:0 8px 22px rgba(0,0,0,.18);
}

.float-line{
  background:#06C755;
}

.float-shop{
  background:#ee4d2d;
}

/* Mobile */
@media(max-width:900px){
  .menu{
    display:none;
  }

  .hero{
    min-height:560px;
  }

  .hero h1{
    font-size:38px;
  }

  .about,
  .review-wrap{
    grid-template-columns:1fr;
  }

  .service-grid{
    grid-template-columns:repeat(2,1fr);
  }

  .grid{
    grid-template-columns:repeat(2,1fr);
  }

  .process{
    grid-template-columns:repeat(2,1fr);
  }
}

@media(max-width:600px){
  .brand img{
    width:46px;
    height:46px;
  }

  .brand-text strong{
    font-size:16px;
  }

  .brand-text span{
    font-size:12px;
  }

  .hero{
    padding:50px 16px;
    min-height:520px;
  }

  .hero-box{
    padding:34px 20px;
    border-radius:28px;
  }

  .hero-logo{
    width:180px;
  }

  .hero h1{
    font-size:31px;
  }

  .hero p{
    font-size:16px;
  }

  section{
    padding:54px 16px;
  }

  .section-title h2{
    font-size:30px;
  }

  .service-grid,
  .grid,
  .process{
    grid-template-columns:1fr;
  }

  .card img{
    height:auto;
  }

  .float-buttons{
    right:14px;
    bottom:16px;
  }
}
</style>
